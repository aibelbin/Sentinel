# Production override for the VPS.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Deliberately does NOT include docker-compose.override.yml, which is
# development-only: that file adds simulated devices, mounts source over the
# image, and runs uvicorn with --reload.

services:
  api:
    # Published on loopback only, so the Tailscale funnel is the single way in
    # from outside. Nothing listens on a public interface directly.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: always

  dashboard:
    restart: always

  liva:
    restart: always

  db:
    restart: always
